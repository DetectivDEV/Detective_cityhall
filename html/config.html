<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>City Hall - Config</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="./css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
</head>

<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>detective_cityhall — Configuration</h1>
            <a href="index.html" class="btn btn-secondary">Back</a>
        </div>

        <form id="configForm">
            <div class="mb-3">
                <label class="form-label">Server display name</label>
                <input type="text" id="serverName" class="form-control" placeholder="Los Santos City Hall">
            </div>

            <div class="mb-3">
                <label class="form-label">Default job</label>
                <input type="text" id="defaultJob" class="form-control" placeholder="unemployed">
            </div>

            <div class="mb-3">
                <label class="form-label">Available jobs (one per line)</label>
                <textarea id="jobsList" class="form-control" rows="6" placeholder="police\nambulance\nmechanic"></textarea>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="enableLicenses">
                <label class="form-check-label" for="enableLicenses">Enable licenses</label>
            </div>

            <div class="mb-3">
                <label class="form-label">Max citizens shown</label>
                <input type="number" id="maxCitizens" class="form-control" value="50" min="1">
            </div>

            <div class="d-flex gap-2">
                <button type="button" id="saveConfig" class="btn btn-primary">Save Configuration</button>
                <button type="button" id="resetConfig" class="btn btn-outline-danger">Reset</button>
            </div>
        </form>

        <div id="alert" class="mt-3" style="display:none;"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.3.slim.js" crossorigin="anonymous"></script>
    <script src="./js/config.js"></script>
</body>

</html>
